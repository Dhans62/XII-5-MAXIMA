<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Posisi Stiker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream:#F2ECDD; --ink:#2B2620; --gold:#B8945A; --line:#e8dfc7; --soft:#6b6354; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Inter",sans-serif; padding:1.25rem; }
  h1 { font-family:"Fraunces",serif; font-size:1.2rem; margin:0 0 1rem; }
  button { cursor:pointer; font-family:inherit; }

  /* TATA LETAK: preview menempel (sticky), kontrol di sebelahnya / di bawahnya */
  .layout { display:flex; gap:1.5rem; align-items:flex-start; }
  .stage-wrap { position:sticky; top:1rem; flex-shrink:0; display:flex; flex-direction:column; gap:0.6rem; }
  #stage { display:block; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.15); touch-action:none; cursor:grab; }
  #stage.is-readonly { cursor:default; }
  .stage-tools { max-width:260px; }
  .drag-hint { margin:0.4rem 0 0; font-size:0.7rem; line-height:1.4; color:var(--soft); }
  .controls { flex:1; min-width:0; max-width:460px; }

  @media (max-width: 720px) {
    body { padding-top:0; }
    h1 { padding-top:1.25rem; }
    .layout { flex-direction:column; gap:0.75rem; }
    .stage-wrap {
      top:0; z-index:20; flex-direction:row; align-items:flex-start; gap:0.75rem;
      margin:0 -1.25rem; padding:0.6rem 1.25rem; width:calc(100% + 2.5rem);
      background:var(--cream); border-bottom:1px solid var(--line);
    }
    .stage-tools { flex:1; max-width:none; }
    .controls { max-width:none; width:100%; }
  }

  .field-group { border:1px solid var(--line); border-radius:12px; padding:0.9rem; margin-bottom:0.9rem; background:#fff; }
  .field-group h3 { margin:0 0 0.6rem; font-size:0.85rem; }
  label { display:block; font-size:0.75rem; color:var(--soft); margin:0.5rem 0 0.15rem; }
  input[type=range] { width:100%; }
  input[type=text], select { width:100%; padding:0.4rem; border-radius:6px; border:1px solid var(--line); font-size:0.8rem; background:#fff; }
  .color-row { display:flex; gap:0.5rem; align-items:center; }
  .color-row input[type=color] { width:40px; height:34px; padding:2px; border-radius:6px; border:1px solid var(--line); flex-shrink:0; }
  .color-row input[type=text] { flex:1; }
  .val { font-size:0.7rem; color:var(--soft); float:right; }

  /* DERET STIKER (tab) */
  .tabs { display:flex; gap:0.5rem; overflow-x:auto; padding:0.25rem 0.15rem 0.6rem; margin-bottom:0.3rem; }
  .tab {
    position:relative; flex-shrink:0; width:52px; height:52px; padding:3px; border-radius:12px;
    border:1px solid var(--line); background:#fff;
  }
  .tab img { width:100%; height:100%; object-fit:contain; border-radius:8px; display:block;
    background:repeating-conic-gradient(#eee 0 25%, transparent 0 50%) 0 0/8px 8px; }
  .tab__num { position:absolute; top:-6px; left:-6px; min-width:18px; height:18px; padding:0 4px; border-radius:9px;
    background:var(--ink); color:var(--cream); font-size:0.65rem; line-height:18px; text-align:center; }
  .tab.is-active { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); }
  .tab--add { display:grid; place-items:center; border:1px dashed var(--gold); color:var(--gold); background:transparent; }

  .sticker-head { display:flex; align-items:center; gap:0.6rem; }
  .sticker-head h3 { flex:1; margin:0; }
  .btn-remove { background:none; border:none; color:#a55; font-size:0.75rem; padding:0.3rem 0.2rem; }
  .file-picker-row { display:flex; align-items:center; gap:0.5rem; }
  .file-picker-current { flex:1; font-size:0.75rem; color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn-pick { padding:0.4rem 0.8rem; border-radius:8px; border:1px solid var(--gold); background:#fff; color:var(--gold); font-size:0.75rem; flex-shrink:0; }
  .empty-note { font-size:0.8rem; color:var(--soft); margin:0; }

  /* IMPOR */
  .row { display:flex; gap:0.5rem; align-items:center; }
  .row select { flex:1; }
  .btn { padding:0.6rem 1rem; border-radius:999px; border:none; background:var(--ink); color:var(--cream); font-size:0.8rem; flex-shrink:0; }
  .btn--ghost { background:#fff; color:var(--ink); border:1px solid var(--ink); }
  .status { font-size:0.75rem; color:var(--soft); margin:0.5rem 0 0; min-height:1em; }
  .status.is-error { color:#a33; }
  textarea { width:100%; min-height:120px; font-family:monospace; font-size:0.75rem; padding:0.6rem; border-radius:8px; border:1px solid var(--line); margin-top:0.6rem; }

  /* GALERI */
  .gallery-modal { position:fixed; inset:0; background:rgba(43,38,32,0.55); display:none; align-items:center; justify-content:center; z-index:100; padding:1rem; }
  .gallery-modal.is-open { display:flex; }
  .gallery-card { background:#fff; border-radius:14px; padding:1rem; max-width:420px; width:100%; max-height:80vh; overflow-y:auto; }
  .gallery-tabs { display:flex; gap:0.4rem; margin-bottom:0.8rem; flex-wrap:wrap; }
  .gallery-tab { flex:1; padding:0.4rem; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:0.75rem; }
  .gallery-tab.is-active { background:var(--ink); color:var(--cream); }
  .gallery-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:0.6rem; }
  .gallery-item { border:1px solid var(--line); border-radius:10px; padding:0.4rem; background:#fff; }
  .gallery-item img { width:100%; aspect-ratio:1; object-fit:contain; background:repeating-conic-gradient(#eee 0 25%, transparent 0 50%) 0 0/8px 8px; border-radius:6px; }
  .gallery-empty { font-size:0.8rem; color:#8a8272; text-align:center; padding:1rem; grid-column:1/-1; }
  .gallery-close { float:right; background:none; border:none; font-size:1rem; }
</style>
</head>
<body>

<h1>Editor Posisi Stiker (tidak perlu kamera)</h1>

<div class="layout">
  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="stage-tools">
      <label for="layoutSelect" style="margin-top:0;">Layout pratinjau</label>
      <select id="layoutSelect">
        <option value="single">1 Foto</option>
        <option value="strip2">2 Foto</option>
        <option value="strip3">3 Foto</option>
        <option value="strip4" selected>4 Foto Strip</option>
        <option value="grid4">4 Foto Grid</option>
        <option value="grid6">6 Foto Grid</option>
      </select>
      <p class="drag-hint" id="dragHint"></p>
    </div>
  </div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="field-group" id="activeSticker"></div>

    <div class="field-group">
      <h3>Frame</h3>
      <label>Warna frame
        <div class="color-row">
          <input type="color" id="frameColorPicker" value="#FFEBF0">
          <input type="text" id="frameColor" value="#FFEBF0">
        </div>
      </label>
      <label>Warna border
        <div class="color-row">
          <input type="color" id="borderColorPicker" value="#F5A0BE">
          <input type="text" id="borderColor" value="#F5A0BE">
        </div>
      </label>
    </div>

    <div class="field-group">
      <h3>Muat template untuk diedit</h3>
      <div class="row">
        <select id="templateSelect"></select>
        <button class="btn" id="loadTemplateBtn">Muat</button>
      </div>
      <label for="pasteBox">Atau tempel kode (hasil Salin dari editor ini)</label>
      <textarea id="pasteBox" placeholder='frameColor: "#FFEBF0",&#10;borderColor: "#F5A0BE",&#10;stickers: [ { src: "assets/stickers/lucu/cute-01.webp", xPct: 74, yPct: -4, sizePct: 26 }, ... ]'></textarea>
      <div class="row" style="margin-top:0.5rem;">
        <button class="btn btn--ghost" id="applyPasteBtn">Terapkan kode</button>
      </div>
      <p class="status" id="importStatus" role="status"></p>
    </div>

    <div class="field-group">
      <h3>Kode untuk themes.js</h3>
      <button class="btn" id="copyBtn">Salin</button>
      <textarea id="codeOutput" readonly></textarea>
    </div>
  </div>
</div>

<div class="gallery-modal" id="galleryModal">
  <div class="gallery-card">
    <button class="gallery-close" id="galleryClose" aria-label="Tutup"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    <div class="gallery-tabs" id="galleryTabs"></div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<script type="module">
import { LAYOUTS, getLayout } from "./js/layouts.js";
import { THEMES } from "./js/themes.js";
import { placeSticker, REF_W, REF_H } from "./js/sticker-placement.js?v=1";

const $ = (id) => document.getElementById(id);
const stage = $("stage");
const ctx = stage.getContext("2d");
const slotW = 480;

let layout = getLayout("strip4");
let frameColor = "#FFEBF0";
let borderColor = "#F5A0BE";
let stickers = [
  { src: "assets/stickers/lucu/cute-01.webp", xPct: 74, yPct: -4, sizePct: 26 },
  { src: "assets/stickers/lucu/cute-02.webp", xPct: -6, yPct: 21, sizePct: 17 },
  { src: "assets/stickers/lucu/cute-03.webp", xPct: 84, yPct: 46, sizePct: 15 },
  { src: "assets/stickers/lucu/cute-04.webp", xPct: -7, yPct: 71, sizePct: 19 },
];
let activeIndex = 0;
let drawId = 0;
let lastDims = { stripW: REF_W, stripH: REF_H };

const FIELDS = {
  xPct: { label: "Posisi X", min: -20, max: 100, step: 0.5 },
  yPct: { label: "Posisi Y", min: -20, max: 100, step: 0.5 },
  sizePct: { label: "Ukuran", min: 5, max: 50, step: 1 },
};
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const round05 = (v) => Math.round(v * 2) / 2;

/* ================= MANIFEST + GALERI ================= */
let manifest = {};
try {
  const res = await fetch("assets/stickers/manifest.json");
  manifest = await res.json();
} catch (e) {
  console.warn("manifest.json belum ada / gagal dimuat. Jalankan scripts/generate_stickers_manifest.py");
}
let galleryActiveCategory = Object.keys(manifest)[0] || null;

function openGallery() {
  renderGalleryTabs();
  renderGalleryGrid();
  $("galleryModal").classList.add("is-open");
}
function closeGallery() { $("galleryModal").classList.remove("is-open"); }

function renderGalleryTabs() {
  const tabs = $("galleryTabs");
  tabs.innerHTML = "";
  Object.keys(manifest).forEach((cat) => {
    const btn = document.createElement("button");
    btn.className = "gallery-tab" + (cat === galleryActiveCategory ? " is-active" : "");
    btn.textContent = `${cat} (${manifest[cat].length})`;
    btn.addEventListener("click", () => {
      galleryActiveCategory = cat;
      renderGalleryTabs();
      renderGalleryGrid();
    });
    tabs.appendChild(btn);
  });
}

function renderGalleryGrid() {
  const grid = $("galleryGrid");
  if (!galleryActiveCategory) {
    grid.innerHTML = `<div class="gallery-empty">Belum ada folder stiker terdeteksi.<br>Jalankan generate_stickers_manifest.py setelah membuat folder + menambah file.</div>`;
    return;
  }
  const files = manifest[galleryActiveCategory] || [];
  if (files.length === 0) {
    grid.innerHTML = `<div class="gallery-empty">Belum ada stiker di kategori ini.<br>Jalankan generate_stickers_manifest.py setelah menambah file.</div>`;
    return;
  }
  grid.innerHTML = "";
  files.forEach((filename) => {
    const path = `assets/stickers/${galleryActiveCategory}/${filename}`;
    const item = document.createElement("button");
    item.className = "gallery-item";
    item.innerHTML = `<img src="${path}" alt="${filename}">`;
    item.addEventListener("click", () => {
      if (stickers[activeIndex]) stickers[activeIndex].src = path;
      closeGallery();
      renderTabs();
      renderActive();
      draw();
    });
    grid.appendChild(item);
  });
}
$("galleryClose").addEventListener("click", closeGallery);

/* ================= GAMBAR ================= */
const imgCache = new Map();
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
  imgCache.set(src, p);
  return p;
}

function dims() {
  const slotH = Math.round(slotW / layout.ratio);
  let cols = 1, rows = layout.count;
  if (layout.arrangement === "grid2x2") { cols = 2; rows = 2; }
  if (layout.arrangement === "grid2x3") { cols = 2; rows = 3; }
  const pad = 24, gap = 16, footer = 56;
  const stripW = pad * 2 + slotW * cols + gap * (cols - 1);
  const stripH = pad * 2 + slotH * rows + gap * (rows - 1) + footer;
  return { slotH, cols, rows, pad, gap, footer, stripW, stripH };
}

// Ukuran tampilan canvas: muat di layar. Di HP preview menempel di atas (maks ~34% tinggi layar).
function fitStage(stripW, stripH) {
  const mobile = window.matchMedia("(max-width: 720px)").matches;
  const maxH = mobile ? window.innerHeight * 0.34 : window.innerHeight - 150;
  const maxW = mobile ? window.innerWidth * 0.5 : 380;
  const scale = Math.min(maxW / stripW, maxH / stripH);
  stage.style.width = Math.round(stripW * scale) + "px";
  stage.style.height = Math.round(stripH * scale) + "px";
}
window.addEventListener("resize", () => fitStage(lastDims.stripW, lastDims.stripH));

async function draw() {
  const myId = ++drawId;
  const d = dims();
  // Muat semua gambar dulu, baru menggambar sekaligus: tidak ada tumpang tindih antar draw()
  const imgs = await Promise.all(stickers.map((s) => loadImg(s.src)));
  if (myId !== drawId) return;

  const { slotH, cols, pad, gap, stripW, stripH } = d;
  lastDims = { stripW, stripH };
  stage.width = stripW;
  stage.height = stripH;
  fitStage(stripW, stripH);

  ctx.fillStyle = frameColor;
  ctx.fillRect(0, 0, stripW, stripH);
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, stripW - 6, stripH - 6);

  for (let i = 0; i < layout.count; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = pad + col * (slotW + gap);
    const y = pad + row * (slotH + gap);
    ctx.fillStyle = "#c9c1ab";
    ctx.fillRect(x, y, slotW, slotH);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 6;
    ctx.strokeRect(x, y, slotW, slotH);
  }

  ctx.fillStyle = "#333";
  ctx.font = "600 20px Inter, sans-serif";
  ctx.fillText("XII-5 · MAXIMA", pad, stripH - 22);

  stickers.forEach((s, i) => {
    if (!imgs[i]) return;
    const { x, y, size } = placeSticker(s, stripW, stripH);
    ctx.drawImage(imgs[i], x, y, size, size);
  });

  // Penanda stiker aktif: hanya di editor, tidak ikut ke hasil Photobooth
  const a = stickers[activeIndex];
  if (a) {
    const { x, y, size } = placeSticker(a, stripW, stripH);
    ctx.save();
    ctx.strokeStyle = "#B8945A";
    ctx.lineWidth = 4;
    ctx.setLineDash([14, 10]);
    ctx.strokeRect(x, y, size, size);
    ctx.restore();
  }

  updateCode();
}

function updateCode() {
  const lines = stickers.map((s) =>
    `          { src: "${s.src}", xPct: ${s.xPct}, yPct: ${s.yPct}, sizePct: ${s.sizePct} },`
  ).join("\n");
  $("codeOutput").value =
`frameColor: "${frameColor}",
borderColor: "${borderColor}",
stickers: [
${lines}
],`;
}

/* ================= STIKER AKTIF ================= */
function setActive(i) {
  activeIndex = i;
  renderTabs();
  renderActive();
  draw();
}

function renderTabs() {
  const wrap = $("tabs");
  wrap.innerHTML = "";
  stickers.forEach((s, i) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (i === activeIndex ? " is-active" : "");
    btn.setAttribute("aria-label", `Stiker ${i + 1}`);
    btn.innerHTML = `<img src="${s.src}" alt="" onerror="this.style.opacity=0.2"><span class="tab__num">${i + 1}</span>`;
    btn.addEventListener("click", () => setActive(i));
    wrap.appendChild(btn);
  });
  const add = document.createElement("button");
  add.className = "tab tab--add";
  add.setAttribute("aria-label", "Tambah stiker");
  add.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
  add.addEventListener("click", () => {
    stickers.push({ src: "assets/stickers/lucu/cute-01.webp", xPct: 40, yPct: 40, sizePct: 15 });
    setActive(stickers.length - 1);
  });
  wrap.appendChild(add);
}

function renderActive() {
  const box = $("activeSticker");
  const s = stickers[activeIndex];
  if (!s) {
    box.innerHTML = `<p class="empty-note">Belum ada stiker. Ketuk tombol + di atas untuk menambah.</p>`;
    return;
  }
  const sliders = Object.entries(FIELDS).map(([field, f]) => `
    <label>${f.label} <span class="val" data-val="${field}">${s[field]}%</span>
      <input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${s[field]}" data-field="${field}">
    </label>`).join("");
  box.innerHTML = `
    <div class="sticker-head">
      <h3>Stiker ${activeIndex + 1} dari ${stickers.length}</h3>
      <button class="btn-remove" id="removeBtn">hapus</button>
    </div>
    <label>File</label>
    <div class="file-picker-row">
      <span class="file-picker-current">${s.src.split("/").pop()}</span>
      <button class="btn-pick" id="pickBtn">Pilih dari galeri</button>
    </div>
    ${sliders}`;

  box.querySelectorAll("input[type=range]").forEach((input) => {
    input.addEventListener("input", () => {
      const field = input.dataset.field;
      stickers[activeIndex][field] = Number(input.value);
      box.querySelector(`[data-val="${field}"]`).textContent = input.value + "%";
      draw();
    });
  });
  $("removeBtn").addEventListener("click", () => {
    stickers.splice(activeIndex, 1);
    activeIndex = clamp(activeIndex, 0, Math.max(0, stickers.length - 1));
    renderTabs();
    renderActive();
    draw();
  });
  $("pickBtn").addEventListener("click", openGallery);
}

// Samakan slider dengan nilai stiker aktif (dipakai saat digeser di canvas)
function syncSliders() {
  const s = stickers[activeIndex];
  if (!s) return;
  const box = $("activeSticker");
  Object.keys(FIELDS).forEach((field) => {
    const input = box.querySelector(`input[data-field="${field}"]`);
    const val = box.querySelector(`[data-val="${field}"]`);
    if (input) input.value = s[field];
    if (val) val.textContent = s[field] + "%";
  });
}

/* ================= GESER DI CANVAS ================= */
function stickerAt(cx, cy) {
  const { stripW, stripH } = dims();
  for (let i = stickers.length - 1; i >= 0; i--) {
    const { x, y, size } = placeSticker(stickers[i], stripW, stripH);
    if (cx >= x && cx <= x + size && cy >= y && cy <= y + size) return i;
  }
  return -1;
}

let drag = null;
stage.addEventListener("pointerdown", (e) => {
  const r = stage.getBoundingClientRect();
  const k = stage.width / r.width;
  const i = stickerAt((e.clientX - r.left) * k, (e.clientY - r.top) * k);
  if (i < 0) return;
  if (i !== activeIndex) setActive(i);
  if (layout.id === "strip4") {
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x0: stickers[i].xPct, y0: stickers[i].yPct, k, i };
    stage.setPointerCapture(e.pointerId);
  }
});
stage.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const s = stickers[drag.i];
  s.xPct = clamp(round05(drag.x0 + ((e.clientX - drag.sx) * drag.k / REF_W) * 100), FIELDS.xPct.min, FIELDS.xPct.max);
  s.yPct = clamp(round05(drag.y0 + ((e.clientY - drag.sy) * drag.k / REF_H) * 100), FIELDS.yPct.min, FIELDS.yPct.max);
  syncSliders();
  draw();
});
const endDrag = () => { drag = null; };
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

function updateDragHint() {
  const isRef = layout.id === "strip4";
  stage.classList.toggle("is-readonly", !isRef);
  $("dragHint").textContent = isRef
    ? "Geser stiker langsung di gambar, atau pakai slider."
    : "Pratinjau saja. Layout ini dihitung otomatis dari posisi di 4 Foto Strip. Pindah ke 4 Foto Strip untuk menggeser.";
}

$("layoutSelect").addEventListener("change", (e) => {
  layout = getLayout(e.target.value);
  updateDragHint();
  draw();
});

/* ================= WARNA FRAME ================= */
function bindColor(textId, pickerId, setter) {
  $(textId).addEventListener("input", (e) => {
    setter(e.target.value);
    if (/^#[0-9a-f]{6}$/i.test(e.target.value)) $(pickerId).value = e.target.value;
    draw();
  });
  $(pickerId).addEventListener("input", (e) => {
    setter(e.target.value);
    $(textId).value = e.target.value;
    draw();
  });
}
bindColor("frameColor", "frameColorPicker", (v) => { frameColor = v; });
bindColor("borderColor", "borderColorPicker", (v) => { borderColor = v; });

function setColors(frame, border) {
  if (frame) {
    frameColor = frame;
    $("frameColor").value = frame;
    if (/^#[0-9a-f]{6}$/i.test(frame)) $("frameColorPicker").value = frame;
  }
  if (border) {
    borderColor = border;
    $("borderColor").value = border;
    if (/^#[0-9a-f]{6}$/i.test(border)) $("borderColorPicker").value = border;
  }
}

/* ================= IMPOR ================= */
function setStatus(msg, isError = false) {
  const el = $("importStatus");
  el.textContent = msg;
  el.classList.toggle("is-error", isError);
}

function applyData(frame, border, list) {
  setColors(frame, border);
  stickers = list.map((s) => ({ ...s }));
  activeIndex = 0;
  renderTabs();
  renderActive();
  draw();
}

// Daftar template dari themes.js (dibaca langsung, tanpa parsing teks)
const templateRefs = [];
Object.entries(THEMES).forEach(([catKey, cat]) => {
  cat.templates.forEach((tpl, idx) => {
    templateRefs.push({ tpl, text: `${cat.label} #${idx + 1}${tpl.label ? " · " + tpl.label : ""} (${tpl.stickers.length} stiker)` });
  });
});
$("templateSelect").innerHTML = templateRefs.map((r, i) => `<option value="${i}">${r.text}</option>`).join("");

$("loadTemplateBtn").addEventListener("click", () => {
  const ref = templateRefs[+$("templateSelect").value];
  if (!ref) return;
  if (!confirm("Ganti isi editor dengan template ini? Perubahan yang belum disalin akan hilang.")) return;
  applyData(ref.tpl.frameColor, ref.tpl.borderColor, ref.tpl.stickers);
  setStatus(`Template dimuat: ${ref.text}.`);
});

const STICKER_RE = /\{\s*src:\s*"([^"]+)"\s*,\s*xPct:\s*(-?\d+(?:\.\d+)?)\s*,\s*yPct:\s*(-?\d+(?:\.\d+)?)\s*,\s*sizePct:\s*(-?\d+(?:\.\d+)?)\s*\}/g;

$("applyPasteBtn").addEventListener("click", () => {
  const text = $("pasteBox").value;
  const list = [...text.matchAll(STICKER_RE)].map((m) => ({
    src: m[1], xPct: Number(m[2]), yPct: Number(m[3]), sizePct: Number(m[4]),
  }));
  if (list.length === 0) {
    setStatus("Tidak ada stiker yang terbaca. Pastikan formatnya { src: \"...\", xPct: 0, yPct: 0, sizePct: 10 }.", true);
    return;
  }
  const frame = text.match(/frameColor:\s*"(#[0-9a-fA-F]{3,8})"/)?.[1];
  const border = text.match(/borderColor:\s*"(#[0-9a-fA-F]{3,8})"/)?.[1];
  applyData(frame, border, list);
  setStatus(`Terbaca ${list.length} stiker${frame || border ? " dan warna frame" : ""}.`);
});

$("copyBtn").addEventListener("click", async () => {
  const btn = $("copyBtn");
  try {
    await navigator.clipboard.writeText($("codeOutput").value);
    btn.textContent = "Tersalin";
  } catch (_) {
    $("codeOutput").select();
    btn.textContent = "Pilih manual lalu salin";
  }
  setTimeout(() => { btn.textContent = "Salin"; }, 1500);
});

/* ================= INIT ================= */
updateDragHint();
renderTabs();
renderActive();
draw();
</script>
</body>
</html>
