<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F2ECDD">
<meta name="description" content="Album kenangan kelas XII-5 MAXIMA, SMAN 1 Prambon, tahun ajaran 2026/2027.">
<meta property="og:title" content="XII-5 · MAXIMA">
<meta property="og:description" content="Album kenangan kelas XII-5 MAXIMA, SMAN 1 Prambon, 2026/2027.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dhans62.github.io/XII-5-MAXIMA/public/images/foto-bersama/foto-utama.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B8945A'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' font-family='Georgia,serif' fill='%232B2620'%3EM%3C/text%3E%3C/svg%3E">
<title>XII-5 · MAXIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>

  <!-- ===== LANDING ===== -->
  <section id="landing" class="landing">
    <div class="landing__inner">
      <figure class="landing__print">
        <span class="landing__tape landing__tape--l"></span>
        <span class="landing__tape landing__tape--r"></span>
        <img src="public/images/foto-bersama/foto-utama.webp" alt="Foto bersama kelas XII-5 MAXIMA" class="landing__photo" fetchpriority="high">
      </figure>
      <div class="landing__content">
        <p class="landing__stamp">Album kenangan kelas</p>
        <p class="landing__school">SMAN 1 Prambon</p>
        <h1 class="landing__title"><span class="landing__kelas">XII-5</span>MAXIMA</h1>
        <p class="landing__year">Tahun Ajaran 2026/2027</p>
        <button id="enterSite" class="landing__enter" aria-label="Buka album kenangan">
          <span>Buka album</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12l7 7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== MAIN CONTENT ===== -->
  <main id="main-content" class="main-content" hidden>

    <nav id="navbar" class="navbar">
      <a href="#main-content" class="navbar__brand">XII-5 · MAXIMA</a>
      <div class="navbar__links">
        <a href="#foto-bersama">Foto Bersama</a>
        <a href="#struktur">Struktur</a>
        <a href="#anggota">Anggota</a>
        <a href="#momen">Momen</a>
        <a href="minigame/index.html">Mini Game</a>
      </div>
    </nav>

    <!-- FOTO BERSAMA -->
    <section id="foto-bersama" class="section section--foto-bersama">
      <figure class="foto-bersama__frame">
        <img src="public/images/foto-bersama/foto-utama.webp" alt="Foto bersama kelas XII-5 MAXIMA" class="foto-bersama__img">
        <figcaption class="foto-bersama__caption">XII-5 · MAXIMA — 2026/2027</figcaption>
      </figure>
      <p id="fotoBersamaStats" class="foto-bersama__stats"></p>
    </section>

    <!-- STRUKTUR KELAS -->
    <section id="struktur" class="section section--struktur">
      <h2 class="section__heading reveal">Struktur Kelas</h2>
      <div id="strukturKelas" class="struktur-grid">
        <!-- diisi otomatis oleh JS dari data/struktur-kelas.json -->
      </div>
    </section>

    <!-- ANGGOTA KELAS -->
    <section id="anggota" class="section section--anggota">
      <h2 class="section__heading">Anggota Kelas</h2>
      <div class="carousel" id="anggotaCarousel">
        <button class="carousel__arrow carousel__arrow--prev" id="anggotaPrev" aria-label="Sebelumnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="carousel__viewport">
          <div class="carousel__track" id="anggotaTrack">
            <!-- diisi otomatis oleh JS dari data/anggota.json -->
          </div>
        </div>
        <button class="carousel__arrow carousel__arrow--next" id="anggotaNext" aria-label="Selanjutnya">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <!-- MOMEN-MOMEN -->
    <section id="momen" class="section section--momen reveal">
      <h2 class="section__heading">Momen-Momen</h2>
      <figure id="momenVideo" class="video-frame" hidden>
        <span class="video-frame__tape video-frame__tape--l"></span>
        <span class="video-frame__tape video-frame__tape--r"></span>
        <div class="video-frame__screen">
          <video class="video-frame__video" controls playsinline></video>
        </div>
        <figcaption class="video-frame__caption" hidden></figcaption>
      </figure>
      <div id="momenContainer" class="momen-container">
        <!-- diisi otomatis oleh JS dari data/momen.json -->
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__socials">
        <a href="https://www.instagram.com/ofc.mmaxima" target="_blank" rel="noopener" aria-label="Instagram kelas" class="footer__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        </a>
        <a href="https://www.tiktok.com/@ofc.mmaxima" target="_blank" rel="noopener" aria-label="TikTok kelas" class="footer__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 3v10.5a3.5 3.5 0 1 1-3.5-3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 3c0 2.5 2 4.5 4.5 4.5" stroke-linecap="round"/></svg>
        </a>
        <a href="minigame/index.html" aria-label="Mini Game" class="footer__icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4" stroke-linecap="round"/><circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="14.5" r="1"/></svg>
        </a>
      </div>
      <p class="footer__credit">
        Dibuat oleh <a href="https://github.com/Dhans62" target="_blank" rel="noopener">Dhans62</a>
      </p>
    </footer>

  </main>

  <!-- ===== MODAL OVERLAY ANGGOTA ===== -->
  <div id="anggotaModal" class="modal">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card">
      <button class="modal__close" data-close aria-label="Tutup">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
      </button>
      <button id="modalSound" class="modal__sound" aria-label="Matikan suara" aria-pressed="false" hidden>
        <svg class="icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <svg class="icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
      </button>
      <div class="modal__photo-wrap">
        <img id="modalPhoto" src="" alt="" class="modal__photo">
      </div>
      <div class="modal__info">
        <span id="modalAbsen" class="modal__absen"></span>
        <h3 id="modalNama" class="modal__nama"></h3>
        <p id="modalHarapan" class="modal__harapan"></p>
      </div>
    </div>
  </div>

<!-- ===== LIGHTBOX MOMEN ===== -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox__btn lightbox__close" aria-label="Tutup"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="lightbox__btn lightbox__prev" aria-label="Sebelumnya"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <img id="lightboxImg" class="lightbox__img" alt="">
    <button class="lightbox__btn lightbox__next" aria-label="Selanjutnya"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span id="lightboxCount" class="lightbox__count"></span>
  </div>

<script src="js/data-loader.js?v=15"></script>
<script src="js/main.js?v=15"></script>
</body>
</html>
